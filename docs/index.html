<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gartenjahr</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gartenjahr">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141814" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f4f1ea;--text:#1f2a21;--leise:#6b7568;--gruen:#2f6b3a;--knopftext:#fff;--karte:#fffdf8;--linie:#e2ddd1}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141814;--text:#e7ebe3;--leise:#9aa596;--gruen:#6fb37a;--knopftext:#102012;--karte:#1d221d;--linie:#2e352d}
}
:root[data-theme="dark"]{--bg:#141814;--text:#e7ebe3;--leise:#9aa596;--gruen:#6fb37a;--knopftext:#102012;--karte:#1d221d;--linie:#2e352d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mitte{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.mitte img{width:96px;height:96px;border-radius:22px}
.mitte h1{margin:0;font-size:22px}
.leise{color:var(--leise);font-size:14px;max-width:340px;margin:0}
.knopf{display:inline-block;border:0;border-radius:10px;padding:11px 16px;background:var(--gruen);color:var(--knopftext);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
input{width:100%;max-width:420px;padding:11px 12px;border-radius:10px;border:1px solid var(--linie);background:var(--karte);color:var(--text);font:inherit}
.versteckt{display:none!important}
</style>
</head>
<body>

<div class="mitte" id="start">
  <img src="icon-192.png" alt="">
  <h1>Gartenjahr</h1>
  <p class="leise">wird geöffnet …</p>
  <a class="knopf" id="go" href="#">Falls nichts passiert, hier tippen</a>
</div>

<div class="mitte versteckt" id="setup">
  <img src="icon-192.png" alt="">
  <h1>Gartenjahr einrichten</h1>
  <p class="leise">Füge einmalig die Web-App-URL aus script.google.com ein (Bereitstellen → Bereitstellungen verwalten, endet auf <b>/exec</b>).</p>
  <input id="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <button class="knopf" id="speichern">Speichern und öffnen</button>
  <p class="leise" id="fehler"></p>
</div>

<script>
// Fest hinterlegte Adresse (optional). Bleibt sie leer, wird sie einmalig abgefragt.
var FEST_URL = '';

function lies(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function schreib(k,v){ try { if(v) localStorage.setItem(k,v); else localStorage.removeItem(k); } catch(e){} }
function gueltig(u){ return /^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[\w-]+\/exec$/.test(u); }

var q = location.search;
if (/[?&]setup/.test(q)) schreib('gj_url', '');
var p = q.match(/[?&]app=([^&]+)/);
if (p && gueltig(decodeURIComponent(p[1]))) schreib('gj_url', decodeURIComponent(p[1]));

var APP = FEST_URL || lies('gj_url');
var standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

function oeffnen(){
  document.getElementById('go').href = APP;
  // ?stay zeigt die Seite ohne Weiterleitung, damit man sie zum Startbildschirm hinzufügen kann
  if (standalone || !/[?&]stay/.test(location.search)) setTimeout(function(){ location.replace(APP); }, 150);
}

if (APP) oeffnen();
else {
  document.getElementById('start').classList.add('versteckt');
  document.getElementById('setup').classList.remove('versteckt');
  document.getElementById('speichern').onclick = function(){
    var u = document.getElementById('url').value.trim();
    if (!gueltig(u)) { document.getElementById('fehler').textContent = 'Das ist keine Web-App-URL. Sie beginnt mit https://script.google.com/macros/s/ und endet auf /exec.'; return; }
    schreib('gj_url', u); APP = u;
    document.getElementById('setup').classList.add('versteckt');
    document.getElementById('start').classList.remove('versteckt');
    oeffnen();
  };
}
</script>
</body>
</html>
