<!DOCTYPE html>
<html lang="de">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gartenjahr</title>
<style>
:root{
  --bg:#f4f1ea; --karte:#fffdf8; --text:#1f2a21; --leise:#6b7568; --linie:#e2ddd1;
  --gruen:#2f6b3a; --gruen-hell:#e3efe1; --gruen-text:#24552e;
  --rot:#b3261e; --rot-hell:#fbe5e2; --blau:#1f5fa8; --blau-hell:#e2ecf8;
  --orange:#a8581f; --orange-hell:#f8eadc; --gelb:#8a6d00; --gelb-hell:#f7efcf;
  --schatten:0 1px 2px rgba(40,35,20,.08),0 2px 8px rgba(40,35,20,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141814; --karte:#1d221d; --text:#e7ebe3; --leise:#9aa596; --linie:#2e352d;
    --gruen:#6fb37a; --gruen-hell:#223524; --gruen-text:#9fd4a7;
    --rot:#f08a80; --rot-hell:#3a1f1c; --blau:#86b4ec; --blau-hell:#1b2838;
    --orange:#e9a06a; --orange-hell:#3a2a1c; --gelb:#e2c560; --gelb-hell:#33301a;
    --schatten:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top))}
header h1{flex:1;margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
.kopfknopf{border:0;background:var(--gruen);color:#fff;width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
@media (prefers-color-scheme: dark){.kopfknopf{color:#102012}}
main{padding:0 16px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--karte);border-top:1px solid var(--linie);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;color:var(--leise);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:20px;line-height:1.2}
nav button.aktiv{color:var(--gruen);font-weight:600}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--leise);margin:22px 2px 8px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 .rechts{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.karte{background:var(--karte);border-radius:14px;box-shadow:var(--schatten);border:1px solid var(--linie);overflow:hidden}
.karte+.karte{margin-top:10px}
.zeile{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--linie);cursor:pointer;min-height:52px}
.zeile:first-child{border-top:0}
.zeile .mitte{flex:1;min-width:0}
.titel{font-weight:600}
.sub{color:var(--leise);font-size:13px}
.ellipse{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--gruen);background:none;cursor:pointer;padding:0;display:grid;place-items:center;font-size:14px;color:#fff}
.chk.an{background:var(--gruen)}
.ueber .sub b{color:var(--rot)}
.erl .titel{text-decoration:line-through;color:var(--leise)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linie);background:var(--karte);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.an{background:var(--gruen);border-color:var(--gruen);color:#fff}
@media (prefers-color-scheme: dark){.chip.an{color:#102012}}
.knopf{border:0;border-radius:10px;padding:10px 14px;background:var(--gruen);color:#fff;font-weight:600;cursor:pointer}
@media (prefers-color-scheme: dark){.knopf{color:#102012}}
.knopf.zwei{background:var(--gruen-hell);color:var(--gruen-text)}
.knopf.rot{background:var(--rot-hell);color:var(--rot)}
.knopf.klein{padding:6px 10px;font-size:13px;border-radius:8px}
.knopf:disabled{opacity:.5}
.reihe{display:flex;gap:8px;flex-wrap:wrap}
.reihe .knopf{flex:1 1 auto}
.voll{width:100%}
.hinweis{border-radius:14px;padding:12px 14px;margin-top:10px}
.hinweis .titel{display:flex;gap:8px;align-items:center}
.hinweis ul{margin:6px 0 0;padding:0;list-style:none}
.hinweis li{padding:6px 0;border-top:1px solid rgba(0,0,0,.07);display:flex;gap:8px;align-items:center}
.h-frost{background:var(--blau-hell)} .h-frost .titel{color:var(--blau)}
.h-trocken{background:var(--orange-hell)} .h-trocken .titel{color:var(--orange)}
.h-giessen{background:var(--gruen-hell)} .h-giessen .titel{color:var(--gruen-text)}
.h-info{background:var(--gelb-hell)} .h-info .titel{color:var(--gelb)}
.thumb{flex:none;width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--gruen-hell);display:grid;place-items:center;font-size:24px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:var(--gruen-hell);color:var(--gruen-text);margin:2px 3px 0 0;white-space:nowrap}
.badge.rot{background:var(--rot-hell);color:var(--rot)}
.badge.blau{background:var(--blau-hell);color:var(--blau)}
.badge.gelb{background:var(--gelb-hell);color:var(--gelb)}
.leer{color:var(--leise);text-align:center;padding:24px 12px}
.suche{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--linie);background:var(--karte)}
label.feld{display:block;margin-top:12px;font-size:13px;color:var(--leise);font-weight:600}
label.feld input,label.feld select,label.feld textarea{display:block;width:100%;margin-top:4px;padding:10px 11px;border-radius:10px;border:1px solid var(--linie);background:var(--bg);font-weight:400;color:var(--text)}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;margin-top:4px;border:1px solid var(--linie);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:9px 6px;cursor:pointer;font-size:14px}
.seg button.an{background:var(--gruen);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){.seg button.an{color:#102012}}
.check{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--gruen)}
/* Bottom-Sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.zu{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(10,15,10,.45)}
.sheet-box{position:relative;background:var(--karte);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:hoch .18s ease-out}
@keyframes hoch{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.griff{width:40px;height:4px;border-radius:2px;background:var(--linie);margin:2px auto 10px}
.sheet-kopf{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.sheet-kopf h3{flex:1;margin:0;font-size:19px}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}
.abschnitt{margin-top:16px}
.abschnitt h4{margin:0 0 4px;font-size:14px;display:flex;gap:6px;align-items:center}
.abschnitt p{margin:0;white-space:pre-line}
.hero{width:100%;max-height:300px;object-fit:cover;border-radius:14px;display:block;background:var(--gruen-hell)}
.aktionen{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.aktionen button{border:1px solid var(--linie);background:var(--bg);border-radius:12px;padding:10px 4px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.aktionen button span{font-size:20px}
.ampel{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:3px 10px;border-radius:10px}
.tagebuch{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tagebuch .tb{cursor:pointer}
.tagebuch img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.tagebuch .sub{font-size:11px;margin-top:2px}
/* Plan */
.plan-leiste{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.plan-wrap{overflow:auto;border-radius:14px;border:1px solid var(--linie);background:#222;max-height:70vh;touch-action:pan-x pan-y pinch-zoom}
.plan-inner{position:relative;min-width:100%}
.plan-inner img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.plan-svg{position:absolute;inset:0;width:100%;height:100%}
.plan-svg polygon{cursor:pointer}
.marker{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--gruen);display:grid;place-items:center;font-size:11px;font-weight:700;color:#24552e;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.marker.neu{background:#ffd54d;border-color:#8a6d00}
.fl-label{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.85);color:#1f2a21;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;pointer-events:none;white-space:nowrap}
.punkt{position:absolute;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#ffd54d;border:2px solid #000;pointer-events:none}
.modus{background:var(--gelb-hell);color:var(--gelb);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14px}
/* Rückblick */
.kacheln{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kachel{background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:10px;text-align:center}
.kachel b{display:block;font-size:22px}
.kachel span{font-size:12px;color:var(--leise)}
.balken{display:flex;align-items:flex-end;gap:4px;height:110px;padding:10px 12px 0}
.balken div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--leise)}
.balken i{display:block;width:100%;background:var(--gruen);border-radius:4px 4px 0 0;min-height:2px}
.vgl{display:flex;gap:6px;align-items:center}
.vgl img{width:76px;height:76px;object-fit:cover;border-radius:8px}
/* Laden / Toast */
#laden{position:fixed;inset:0;z-index:80;background:rgba(10,15,10,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-weight:600;text-align:center;padding:20px}
#laden.zu{display:none}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:dreh 0.9s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
#quelle{position:fixed;inset:0;z-index:95;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:rgba(10,15,10,.5)}
#quelle.zu{display:none}
#quelle .box{background:var(--karte);color:var(--text);border-radius:16px;padding:16px;max-width:420px;width:100%}
#quelle .box p{margin:0 0 12px;font-weight:600}
#frage{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,15,10,.5)}
#frage.zu{display:none}
#frage .box{background:var(--karte);color:var(--text);border-radius:16px;padding:18px;max-width:380px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#frage .box p{margin:0 0 16px;font-size:15px}
#frage .reihe{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:90;background:#1f2a21;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.an{opacity:1}
#toast.fehler{background:var(--rot);color:#fff}
.zurueck{border:0;background:none;color:var(--gruen);font-weight:600;padding:0;cursor:pointer;margin:4px 0 6px}
.willkommen ol{margin:8px 0 0;padding-left:20px}
.willkommen li{margin:6px 0}
.klein:not(.knopf){font-size:12px;color:var(--leise)}
</style>
</head>
<body>
<header><h1 id="kopfTitel">Gartenjahr</h1><button class="kopfknopf" id="kopfPlus" style="display:none">+</button></header>
<main id="inhalt"><div class="leer">Lade …</div></main>
<nav id="nav">
  <button data-tab="aufgaben"><span>✅</span>Aufgaben</button>
  <button data-tab="pflanzen"><span>🌿</span>Pflanzen</button>
  <button data-tab="plan"><span>🗺️</span>Plan</button>
  <button data-tab="einkauf"><span>🛒</span>Einkauf</button>
  <button data-tab="mehr"><span>☰</span>Mehr</button>
</nav>
<div id="sheet" class="sheet zu"><div class="sheet-bg" onclick="sheetZu()"></div><div class="sheet-box"><div class="griff"></div><div id="sheetInhalt"></div></div></div>
<div id="laden" class="zu"><div class="spinner"></div><div id="ladenText"></div></div>
<div id="toast"></div>
<div id="quelle" class="zu"><div class="box"><p>Foto aufnehmen oder aus der Galerie wählen?</p><div style="display:grid;gap:8px"><button class="knopf" id="qKamera">📷 Kamera</button><button class="knopf zwei" id="qGalerie">🖼️ Galerie</button><button class="knopf zwei" id="qAbbruch">Abbrechen</button></div></div></div>
<div id="frage" class="zu"><div class="box"><p id="frageText"></p><div class="reihe"><button class="knopf zwei" id="frageNein">Abbrechen</button><button class="knopf" id="frageJa">OK</button></div></div></div>
<input type="file" id="dateiInput" accept="image/*" style="display:none">

<script>
/* ================= Grundlagen ================= */
const S = { d:null, tab:'aufgaben', katFilter:'Alle', flFilter:'', suche:'', mehr:'', offenErledigt:false,
  plan:{ bild:null, zoom:1, modus:'ansehen', punkte:[], ziel:null }, tmp:{} };

const KAT = { 'Schnitt':'✂️','Düngen':'🧪','Rasen':'🟩','Mähroboter':'🤖','Bewässerung':'💧','Winterschutz':'❄️',
  'Umtopfen':'🪴','Pflege':'🌿','Pflanzenschutz':'🐛','Gießen':'🚿','Sonstiges':'📌' };
const KATEGORIEN = Object.keys(KAT);
const FL_TYPEN = ['Beet','Rasen','Hecke','Gehölz','Gemüse/Kräuter','Terrasse/Kübel','Balkon','Zimmer','Winterquartier','Sonstiges'];
const FARBEN = ['#4c9a52','#d08a2e','#3f7fbf','#b5527a','#7b6bc4','#2e9c94','#c2543a','#8a9a2e','#5d6d7e'];

function api(fn, ...args){
  return new Promise((res, rej) => {
    const r = google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e));
    r[fn].apply(r, args);
  });
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
/** Eigene Rückfrage statt confirm() – ohne Browser-Überschrift. */
function frage(text, jaText){
  return new Promise(res => {
    $('frageText').textContent = text; $('frageJa').textContent = jaText || 'OK';
    $('frage').classList.remove('zu');
    const ende = v => { $('frage').classList.add('zu'); res(v); };
    $('frageJa').onclick = () => ende(true); $('frageNein').onclick = () => ende(false);
  });
}
function laden(t){ $('ladenText').textContent = t || ''; $('laden').classList.remove('zu'); }
function fertig(){ $('laden').classList.add('zu'); }
let toastT;
function toast(t, fehler){ const e=$('toast'); e.textContent=t; e.className='an'+(fehler?' fehler':''); clearTimeout(toastT); toastT=setTimeout(()=>e.className='', fehler?5000:2400); }
function fehler(e){ fertig(); toast((e && e.message) ? e.message.replace(/^Exception: /,'') : String(e), true); }
async function mit(text, fn){ laden(text); try { const r = await fn(); fertig(); return r; } catch(e){ fehler(e); throw e; } }

function heute(){ return S.d ? S.d.heute : new Date().toISOString().slice(0,10); }
function addTage(iso, n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function diffTage(a,b){ return Math.round((new Date(b.slice(0,10)+'T12:00:00Z')-new Date(a.slice(0,10)+'T12:00:00Z'))/864e5); }
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function fd(iso){ if(!iso) return ''; const s = iso.slice(8,10)+'.'+iso.slice(5,7)+'.'; return iso.slice(0,4)!==heute().slice(0,4) ? s+iso.slice(2,4) : s; }
function fdLang(iso){ if(!iso) return ''; return Number(iso.slice(8,10))+'. '+MONATE[Number(iso.slice(5,7))-1]+' '+iso.slice(0,4); }

function index(){
  const d = S.d;
  S.flM = Object.fromEntries(d.flaechen.map(f=>[f.id,f]));
  S.pfM = {};
  d.pflanzen.forEach(p => { try { p.prof = p.profil ? JSON.parse(p.profil) : null; } catch(e){ p.prof = null; } if(p.prof && !(p.prof.schnitt||p.prof.kurzinfo||p.prof.duengen||Array.isArray(p.prof.aufgaben))) p.prof = null; S.pfM[p.id]=p; });
  S.krM = Object.fromEntries(d.kreise.map(k=>[k.id,k]));
  d.flaechen.sort((a,b)=> (a.bereich===b.bereich ? a.name.localeCompare(b.name,'de') : (a.bereich==='Draußen'?-1:1)));
  d.pflanzen.sort((a,b)=> a.name.localeCompare(b.name,'de'));
}

async function neuLaden(still){
  try {
    if(!still) laden('Lade Garten …');
    S.d = await api('ladeAlles');
    index(); render(); fertig();
  } catch(e){ fehler(e); if(!S.d) $('inhalt').innerHTML = '<div class="leer">'+esc(e.message||e)+'</div>'; }
}

/* ================= Navigation ================= */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.mehr=''; window.scrollTo(0,0); render(); });
function render(){
  if(!S.d) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('aktiv', b.dataset.tab===S.tab));
  const titel = {aufgaben:'Aufgaben', pflanzen:'Pflanzen', plan:'Gartenplan', einkauf:'Einkaufsliste', mehr:'Mehr'}[S.tab];
  $('kopfTitel').textContent = titel;
  const plus = $('kopfPlus');
  plus.style.display = (S.tab==='aufgaben'||S.tab==='pflanzen'||(S.tab==='mehr'&&(S.mehr==='flaechen'||S.mehr==='kreise'))) ? '' : 'none';
  plus.onclick = S.tab==='aufgaben' ? ()=>aufgabeForm() : S.tab==='pflanzen' ? ()=>neuePflanzeStart() : S.mehr==='flaechen' ? ()=>flaecheForm() : ()=>kreisForm();
  ({aufgaben:renderAufgaben, pflanzen:renderPflanzen, plan:renderPlan, einkauf:renderEinkauf, mehr:renderMehr})[S.tab]();
}

/* ================= Sheet ================= */
function sheet(titel, html){
  $('sheetInhalt').innerHTML = '<div class="sheet-kopf"><h3>'+titel+'</h3><button class="x" onclick="sheetZu()">✕</button></div>'+html;
  $('sheet').classList.remove('zu');
  $('sheet').querySelector('.sheet-box').scrollTop = 0;
}
function sheetZu(){ $('sheet').classList.add('zu'); }

/* ================= Bilder ================= */
/** Fragt Kamera oder Galerie ab. Liefert 'kamera', 'galerie' oder null. */
function fotoQuelle(){
  return new Promise(res => {
    $('quelle').classList.remove('zu');
    const ende = v => { $('quelle').classList.add('zu'); res(v); };
    $('qKamera').onclick = () => ende('kamera'); $('qGalerie').onclick = () => ende('galerie'); $('qAbbruch').onclick = () => ende(null);
  });
}
function dateiWaehlen(quelle){
  return new Promise((res) => {
    const inp = $('dateiInput'); inp.value='';
    if(quelle === 'kamera') inp.setAttribute('capture', 'environment'); else inp.removeAttribute('capture');
    inp.onchange = () => res(inp.files && inp.files[0] ? inp.files[0] : null);
    inp.click();
  });
}
function bildLaden(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => res({img, url});
    img.onerror = () => rej(new Error('Das Bild konnte nicht gelesen werden.'));
    img.src = url;
  });
}
function aufCanvas(img, max, quadrat, q){
  let w = img.naturalWidth, h = img.naturalHeight, sx=0, sy=0, sw=w, sh=h;
  if(quadrat){ const m=Math.min(w,h); sx=(w-m)/2; sy=(h-m)/2; sw=sh=m; w=h=m; }
  const f = Math.min(1, max/Math.max(w,h));
  const c = document.createElement('canvas'); c.width=Math.round(w*f); c.height=Math.round(h*f);
  c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
/** Startet die Dateiauswahl (muss direkt im Klick passieren) und liefert {bild, thumb}. */
async function fotoHolen(maxGross, nurGalerie){
  const quelle = nurGalerie ? 'galerie' : await fotoQuelle();
  if(!quelle) return null;
  const file = await dateiWaehlen(quelle);
  if(!file) return null;
  const {img, url} = await bildLaden(file);
  const out = { bild: aufCanvas(img, maxGross||1600, false, 0.85), thumb: aufCanvas(img, 240, true, 0.72) };
  if(out.thumb.length > 45000) out.thumb = aufCanvas(img, 200, true, 0.5); // Zellgrenze der Tabelle
  URL.revokeObjectURL(url);
  return out;
}

/* ---- Gleiche Maßnahmen mit überlappendem Zeitraum zusammenfassen ---- */
// Bei diesen Kategorien zählt die Kategorie als „gleiche Maßnahme“, sonst muss der Titel gleich sein.
const GRUPPE_NACH_KAT = ['Schnitt','Düngen','Winterschutz','Umtopfen'];
function gruppenKey(a){
  if(!S.pfM[a.bezugId]) return null; // nur Pflanzenaufgaben (Rasen, Technik bleiben einzeln)
  return GRUPPE_NACH_KAT.includes(a.kategorie) ? 'k|'+a.kategorie : 't|'+a.kategorie+'|'+String(a.titel||'').toLowerCase().replace(/\s+/g,' ').trim();
}
function spanne(von, bis){ return diffTage(von, bis) + 1; }
/** Liefert Gruppen {key, liste, von, bis}; von/bis = gemeinsamer Zeitraum. Überlappung mind. 50 % des kürzeren Zeitraums. */
function zusammenfassen(liste){
  const gruppen = [];
  liste.slice().sort((a,b)=>a.von<b.von?-1:a.von>b.von?1:0).forEach(a=>{
    const k = gruppenKey(a);
    const g = k && gruppen.find(g=>{
      if(g.key!==k) return false;
      const v = a.von>g.von?a.von:g.von, b = a.bis<g.bis?a.bis:g.bis;
      return b>=v && spanne(v,b) >= 0.5*Math.min(spanne(a.von,a.bis), spanne(g.von,g.bis));
    });
    if(g){ g.liste.push(a); if(a.von>g.von) g.von=a.von; if(a.bis<g.bis) g.bis=a.bis; }
    else gruppen.push({key:k||('e|'+a.id), liste:[a], von:a.von, bis:a.bis});
  });
  return gruppen;
}
function gruppeTitel(g){
  const a = g.liste[0];
  const gleich = g.liste.every(x=>x.titel===a.titel);
  return (gleich ? a.titel : a.kategorie)+' · '+g.liste.length+' Pflanzen';
}
function gruppeZeile(g){
  if(g.liste.length===1) return aufgabeZeile(g.liste[0]);

}

async function pflanzeSpeichern(id){

    haltung:segWert('haltung'), winterFlaecheId:feld('pfWinter'), bewaesserung:segWert('bew'), kreisId:feld('pfKreis'),

function standortAmpel(p, prof){
  const f = aktuelleFlaeche(p);
  if(!f || !f.licht || !prof || !Array.isArray(prof.licht) || !prof.licht.length) return '';
  const stufen = ['schattig','halbschattig','sonnig'];
  const ist = stufen.indexOf(f.licht);
  if(prof.licht.includes(f.licht)) return '<span class="ampel" style="background:var(--gruen-hell);color:var(--gruen-text)">● Standort passt</span>';
  const nah = prof.licht.some(l=>Math.abs(stufen.indexOf(l)-ist)===1);
  return nah ? '<span class="ampel" style="background:var(--gelb-hell);color:var(--gelb)">● bedingt geeignet</span>'
             : '<span class="ampel" style="background:var(--rot-hell);color:var(--rot)">● Standort ungeeignet</span>';
}

// Zwischenspeicher für große Fotos (bleibt, solange die App offen ist)
const BILDER = {};
function titelfotoLaden(id){
  const hero = $('pfHero'); if(!hero) return;
  const p = S.d.pflanzen.find(x=>x.id===id) || {};
  const k = id + ':' + (p.thumb||'').length + ':' + (p.thumb||'').slice(-24);
  const setzen = src => { if (src && $('pfHero') === hero) hero.src = src; };
  if (BILDER[k]) return setzen(BILDER[k]);
  api('getTitelfoto', id).then(src => { if(src) BILDER[k] = src; setzen(src); }).catch(()=>{});
}
async function ladeTagebuch(id){
  titelfotoLaden(id); // parallel zur Fotoliste, nicht erst danach
  try {
    const fotos = await api('getFotos', id);
    S.tmp.fotos = fotos;
    const el = $('tagebuch'); if(!el) return;
    if(!fotos.length){ el.innerHTML = 'Noch keine Fotos. Mit „Foto ins Tagebuch“ oder „Zustand prüfen“ dokumentierst du das Wachstum.'; return; }
    el.className = 'tagebuch';
    el.innerHTML = fotos.map(f => {
      const zf = {gut:'',mittel:' gelb',schlecht:' rot'}[f.zustand]||'';
      return '<div class="tb" onclick="fotoAnsehen(\''+f.id+'\')"><img src="'+esc((f.thumb||''))+'"><div class="sub">'+fd(f.datum.slice(0,10))+' · '+esc(f.art)+(f.zustand?' <span class="badge'+zf+'">'+esc(f.zustand)+'</span>':'')+'</div></div>';
    }).join('');
  } catch(e){ const el=$('tagebuch'); if(el) el.textContent = 'Fotos konnten nicht geladen werden.'; }
}
async function fotoAnsehen(fotoId){
  const f = (S.tmp.fotos||[]).find(x=>x.id===fotoId);
  let bild;
  if (BILDER[fotoId]) bild = BILDER[fotoId];
  else { try { bild = await mit('Lade Foto …', ()=>api('getFoto', fotoId)); BILDER[fotoId] = bild; } catch(e){ return; } }
  const b = f && f.bewertung ? (()=>{ try { return JSON.parse(f.bewertung); } catch(e){ return null; } })() : null;
  let html = '<img src="'+esc(bild)+'" style="width:100%;border-radius:12px">';
  if(f){
    html += '<p class="sub">'+fdLang(f.datum.slice(0,10))+' · '+esc(f.art)+'</p>';
    if(f.notiz) html += abschnitt('📝','Notiz', f.notiz);
    if(b) html += bewertungHtml(b, false);
    html += '<div class="reihe" style="margin-top:14px"><button class="knopf zwei" onclick="pflanzeDetail(\''+f.pflanzeId+'\')">‹ Zurück</button><button class="knopf rot" onclick="fotoLoeschen(\''+f.id+'\',\''+f.pflanzeId+'\')">Foto löschen</button></div>';
  }
  sheet('Foto', html);
}

function flFarbe(id){ const i = S.d.flaechen.findIndex(f=>f.id===id); return FARBEN[(i<0?0:i)%FARBEN.length]; }
async function renderPlan(){
  const e = S.d.einstellungen;
  if(!e.hatPlan){
    $('inhalt').innerHTML = '<div class="karte" style="padding:16px"><div class="titel">🗺️ Gartenplan anlegen</div>'+
      '<ol style="padding-left:20px;margin:8px 0"><li>In Google Maps auf <b>Satellit</b> umschalten.</li><li>Auf dein Grundstück zoomen, sodass es den Bildschirm füllt (Norden oben).</li><li>Screenshot machen.</li><li>Hier hochladen.</li></ol>'+
      '<p class="sub">Danach zeichnest du die Flächen ein und setzt die Pflanzen per Antippen.</p>'+
      '<button class="knopf voll" style="margin-top:8px" onclick="planHochladen()">Screenshot hochladen</button></div>';
    return;
  }
  if(!S.plan.bild){
    $('inhalt').innerHTML = '<div class="leer">Lade Plan …</div>';
    try { S.plan.bild = await api('getPlanBild'); } catch(err){ return fehler(err); }
    if(S.tab!=='plan') return;
  }
  zeichnePlan();
}
function zeichnePlan(){
  const P = S.plan;
  const draussen = S.d.flaechen.filter(f=>f.bereich!=='Drinnen');
  let leiste = '';
  if(P.modus==='ansehen'){
    leiste = '<div class="plan-leiste"><button class="knopf klein" onclick="planFlaecheWaehlen()">▦ Fläche einzeichnen</button><button class="knopf klein" onclick="planPflanzeWaehlen()">🌿 Pflanze setzen</button>'+
      '<span style="margin-left:auto"></span><button class="knopf klein zwei" onclick="planZoom(-1)">−</button><button class="knopf klein zwei" onclick="planZoom(1)">+</button></div>';
  } else if(P.modus==='zeichnen'){
    leiste = '<div class="modus">Tippe die Ecken von <b>'+esc(S.flM[P.ziel].name)+'</b> nacheinander an ('+P.punkte.length+' Punkte).</div>'+
      '<div class="plan-leiste"><button class="knopf klein" onclick="planFertig()" '+(P.punkte.length<3?'disabled':'')+'>✓ Fertig</button><button class="knopf klein zwei" onclick="P_undo()">↶ Zurück</button><button class="knopf klein zwei" onclick="planAbbruch()">Abbrechen</button>'+
      (S.flM[P.ziel].plan?'<button class="knopf klein rot" onclick="planFlaecheEntfernen()">Umriss entfernen</button>':'')+
      '<span style="margin-left:auto"></span><button class="knopf klein zwei" onclick="planZoom(-1)">−</button><button class="knopf klein zwei" onclick="planZoom(1)">+</button></div>';
  } else {
    leiste = '<div class="modus">Tippe auf die Stelle, an der <b>'+esc(S.pfM[P.ziel].name)+'</b> steht.</div>'+
      '<div class="plan-leiste"><button class="knopf klein zwei" onclick="planAbbruch()">Abbrechen</button>'+
      (S.pfM[P.ziel].planX!==''?'<button class="knopf klein rot" onclick="planPflanzeEntfernen()">Vom Plan nehmen</button>':'')+
      '<span style="margin-left:auto"></span><button class="knopf klein zwei" onclick="planZoom(-1)">−</button><button class="knopf klein zwei" onclick="planZoom(1)">+</button></div>';
  }
  let svg = '', labels = '', marker = '';
  draussen.forEach(f => {
    let pts; try { pts = f.plan ? JSON.parse(f.plan) : null; } catch(e){ pts=null; }
    if(!pts || pts.length<3) return;
    const c = flFarbe(f.id);
    svg += '<polygon points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'" fill="'+c+'" fill-opacity="0.28" stroke="'+c+'" stroke-width="2" vector-effect="non-scaling-stroke" onclick="planFlaecheKlick(event,\''+f.id+'\')"/>';
    const cx = pts.reduce((s,p)=>s+p[0],0)/pts.length, cy = pts.reduce((s,p)=>s+p[1],0)/pts.length;
    labels += '<div class="fl-label" style="left:'+(cx*100)+'%;top:'+(cy*100)+'%">'+esc(f.name)+'</div>';
  });
  if(P.modus==='zeichnen' && P.punkte.length){
    svg += '<polyline points="'+P.punkte.map(p=>p[0]+','+p[1]).join(' ')+'" fill="none" stroke="#ffd54d" stroke-width="3" vector-effect="non-scaling-stroke"/>';
    labels += P.punkte.map(p=>'<div class="punkt" style="left:'+(p[0]*100)+'%;top:'+(p[1]*100)+'%"></div>').join('');
  }
  S.d.pflanzen.forEach(p => {
    if(p.planX==='' || p.planX===undefined || p.standort==='Winter') return;
    const k = p.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    marker += '<div class="marker'+(P.modus==='setzen'&&P.ziel===p.id?' neu':'')+'" style="left:'+(Number(p.planX)*100)+'%;top:'+(Number(p.planY)*100)+'%" title="'+esc(p.name)+'" onclick="planMarkerKlick(event,\''+p.id+'\')">'+esc(k)+'</div>';
  });
  const ohneUmriss = draussen.filter(f=>!f.plan);
  const ohnePunkt = S.d.pflanzen.filter(p=>p.planX==='' && (S.flM[p.flaecheId]||{}).bereich!=='Drinnen');
  $('inhalt').innerHTML = leiste +
    '<div class="plan-wrap"><div class="plan-inner" id="planInner" style="width:'+(P.zoom*100)+'%" onclick="planKlick(event)"><img src="'+esc(P.bild)+'" draggable="false"><svg class="plan-svg" viewBox="0 0 1 1" preserveAspectRatio="none">'+svg+'</svg>'+labels+marker+'</div></div>'+
    (P.modus==='ansehen' ? (
      (ohneUmriss.length?'<p class="sub" style="margin-top:10px">Noch nicht eingezeichnet: '+ohneUmriss.map(f=>esc(f.name)).join(', ')+'</p>':'')+
      (ohnePunkt.length?'<p class="sub">Noch nicht platziert: '+ohnePunkt.length+' Pflanze(n)</p>':'')+
      '<button class="knopf klein zwei" style="margin-top:12px" onclick="planHochladen()">Screenshot ersetzen</button>') : '');
}
function planZoom(r){ const z=[1,1.5,2,3,4]; let i=z.indexOf(S.plan.zoom); i=Math.max(0,Math.min(z.length-1,i+r)); S.plan.zoom=z[i]; zeichnePlan(); }
function planKoord(ev){ const r=$('planInner').getBoundingClientRect(); return [Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)), Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height))]; }
function planKlick(ev){
  const P = S.plan;
  if(P.modus==='zeichnen'){ P.punkte.push(planKoord(ev).map(v=>Math.round(v*10000)/10000)); zeichnePlan(); }
  else if(P.modus==='setzen'){ const [x,y]=planKoord(ev); planPflanzeSpeichern(x,y); }
}
function planFlaecheKlick(ev, id){ if(S.plan.modus!=='ansehen') return; ev.stopPropagation(); flaecheDetail(id); }
function planMarkerKlick(ev, id){ if(S.plan.modus!=='ansehen') return; ev.stopPropagation(); pflanzeDetail(id); }
function planFlaecheWaehlen(){
  const fl = S.d.flaechen.filter(f=>f.bereich!=='Drinnen');
  if(!fl.length) return toast('Lege zuerst Flächen an (Mehr → Flächen).', true);
  sheet('Welche Fläche einzeichnen?', '<div class="karte">'+fl.map(f=>'<div class="zeile" onclick="planStartZeichnen(\''+f.id+'\')"><span style="width:14px;height:14px;border-radius:4px;background:'+flFarbe(f.id)+'"></span><div class="mitte"><div class="titel">'+esc(f.name)+'</div><div class="sub">'+(f.plan?'eingezeichnet – neu zeichnen':'noch nicht eingezeichnet')+'</div></div></div>').join('')+'</div>');
}
function planStartZeichnen(id){ sheetZu(); Object.assign(S.plan, {modus:'zeichnen', ziel:id, punkte:[]}); zeichnePlan(); }
function P_undo(){ S.plan.punkte.pop(); zeichnePlan(); }
function planAbbruch(){ Object.assign(S.plan, {modus:'ansehen', ziel:null, punkte:[]}); zeichnePlan(); }
async function planFertig(){
  const P = S.plan; if(P.punkte.length<3) return;
  await mit('Speichere …', ()=>api('speicherePlanFlaeche', P.ziel, JSON.stringify(P.punkte)));

async function planFlaecheEntfernen(){
  await mit('Speichere …', ()=>api('speicherePlanFlaeche', S.plan.ziel, ''));
  S.flM[S.plan.ziel].plan = ''; planAbbruch();

function planPflanzeWaehlen(){
  const pf = S.d.pflanzen.filter(p=>(S.flM[p.flaecheId]||{}).bereich!=='Drinnen');
  if(!pf.length) return toast('Noch keine Pflanzen draußen angelegt.', true);

}
function planStartSetzen(id){ sheetZu(); Object.assign(S.plan, {modus:'setzen', ziel:id}); zeichnePlan(); }
async function planPflanzeSpeichern(x, y){
  const id = S.plan.ziel;
  await mit('Speichere …', ()=>api('speicherePlanPflanze', id, x, y));

  const id = S.plan.ziel;
  await mit('Speichere …', ()=>api('speicherePlanPflanze', id, null, null));
  S.pfM[id].planX = ''; S.pfM[id].planY = ''; planAbbruch();

  let foto;
  try { foto = await fotoHolen(2200, true); } catch(e){ return fehler(e); }

/* ================= Einkauf ================= */
function renderEinkauf(){
  const h = heute();
  const offen = S.d.einkauf.filter(e=>e.status==='offen');
  const erl = S.d.einkauf.filter(e=>e.status==='erledigt');
  const schon = new Set(S.d.einkauf.map(e=>e.aufgabeId).filter(Boolean));
  const vorschlaege = S.d.aufgaben.filter(a=>a.status==='offen' && a.material && a.von<=addTage(h,42) && !schon.has(a.id)).sort((a,b)=>a.von<b.von?-1:1);
  let html = '<div class="reihe"><input class="suche" id="ekNeu" placeholder="Artikel hinzufügen …" style="flex:1" onkeydown="if(event.key===\'Enter\')einkaufHinzu()"><button class="knopf" onclick="einkaufHinzu()">+</button></div>';
  html += '<h2>Einkaufsliste <span class="sub">'+offen.length+'</span></h2>';
  html += offen.length ? '<div class="karte">'+offen.map(e=>'<div class="zeile"><button class="chk" onclick="einkaufHaken(\''+e.id+'\',true)"></button><div class="mitte"><div class="titel">'+esc(e.artikel)+(e.menge?' <span class="sub">'+esc(e.menge)+'</span>':'')+'</div>'+(e.notiz?'<div class="sub ellipse">'+esc(e.notiz)+'</div>':'')+'</div><button class="x" onclick="einkaufWeg(\''+e.id+'\')">✕</button></div>').join('')+'</div>' : '<div class="karte"><div class="leer">Nichts zu besorgen.</div></div>';
  if(vorschlaege.length){
    html += '<h2>Vorschläge aus den nächsten 6 Wochen</h2><div class="karte">'+vorschlaege.map(a=>'<div class="zeile"><div class="mitte"><div class="titel">'+esc(a.material)+'</div><div class="sub ellipse">'+esc(a.titel)+' · '+esc(bezugText(a))+' · ab '+fd(a.von)+'</div></div><button class="knopf klein zwei" onclick="einkaufVorschlag(\''+a.id+'\')">+ Liste</button></div>').join('')+'</div>';
  }
  if(erl.length){
    html += '<h2>Erledigt <span class="sub">'+erl.length+'</span><span class="rechts"><button class="knopf klein zwei" onclick="einkaufAufraeumen()">Leeren</button></span></h2><div class="karte">'+
      erl.map(e=>'<div class="zeile erl"><button class="chk an" onclick="einkaufHaken(\''+e.id+'\',false)">✓</button><div class="mitte"><div class="titel">'+esc(e.artikel)+'</div></div></div>').join('')+'</div>';
  }
  $('inhalt').innerHTML = html;
}
async function einkaufHinzu(){
  const t = feld('ekNeu'); if(!t) return;
  await mit('Speichere …', ()=>api('einkaufNeu', {artikel:t}));
  neuLaden(true);
}
async function einkaufVorschlag(aid){
  const a = S.d.aufgaben.find(x=>x.id===aid);
  await mit('Speichere …', ()=>api('einkaufNeu', {artikel:a.material, notiz:a.titel+' – '+bezugText(a), aufgabeId:a.id}));
  neuLaden(true);
}
async function einkaufHaken(id, erl){
  const e = S.d.einkauf.find(x=>x.id===id); e.status = erl?'erledigt':'offen'; renderEinkauf();
  try { await api('einkaufStatus', id, erl); } catch(err){ fehler(err); neuLaden(true); }
}
async function einkaufWeg(id){ await mit('Lösche …', ()=>api('einkaufLoeschen', id)); neuLaden(true); }
async function einkaufAufraeumen(){ await mit('Räume auf …', ()=>api('einkaufAufraeumen')); neuLaden(true); }

/* ================= Mehr ================= */
function renderMehr(){
  if(S.mehr==='flaechen') return renderFlaechen();
  if(S.mehr==='kreise') return renderKreise();
  if(S.mehr==='rueckblick') return renderRueckblick();
  if(S.mehr==='einstellungen') return renderEinstellungen();
  if(S.mehr==='ausgeblendet') return renderAusgeblendet();
  const z = (key, icon, titel, sub) => '<div class="zeile" onclick="S.mehr=\''+key+'\';render()"><div class="thumb">'+icon+'</div><div class="mitte"><div class="titel">'+titel+'</div><div class="sub">'+sub+'</div></div><span>›</span></div>';
  $('inhalt').innerHTML = '<div class="karte" style="margin-top:6px">'+
    z('flaechen','▦','Flächen', S.d.flaechen.length+' Flächen – Beete, Rasen, Zimmer, Winterquartier')+
    z('kreise','💧','Bewässerungskreise', S.d.kreise.length+' Kreise')+
    z('rueckblick','📅','Jahresrückblick','Was wurde wann gemacht, Vorher-nachher')+
    z('ausgeblendet','🚫','Ausgeblendete Aufgaben', (S.d.ausgeblendet||[]).length+' werden nicht mehr geplant')+
    z('einstellungen','⚙️','Einstellungen','KI-Schlüssel, Ort, Mähroboter, Erinnerungen')+
    '</div><p class="klein" style="text-align:center;margin-top:18px">Gartenjahr '+esc(S.d.version)+' · <a href="'+S.d.links.tabelle+'" target="_blank">Tabelle</a> · <a href="'+S.d.links.ordner+'" target="_blank">Drive-Ordner</a></p>';
}
const zurueck = '<button class="zurueck" onclick="S.mehr=\'\';render()">‹ Mehr</button>';
function renderAusgeblendet(){
  const l = (S.d.ausgeblendet||[]).slice().sort((a,b)=>(bezugText(a)+a.titel).localeCompare(bezugText(b)+b.titel));
  $('inhalt').innerHTML = zurueck + '<h2>Ausgeblendete Aufgaben</h2>'+
    (l.length ? '<div class="karte">'+l.map((a,i)=>'<div class="zeile"><div class="thumb">'+(KAT[a.kategorie]||'🚫')+'</div><div class="mitte"><div class="titel">'+esc(a.titel)+'</div><div class="sub">'+esc(bezugText(a)||'')+'</div></div><button class="knopf klein zwei" style="flex:none" onclick="wiederPlanen('+i+')">Wieder planen</button></div>').join('')+'</div>'
      : '<div class="leer">Keine. Geplante Aufgaben kannst du in der Aufgabe mit „Nicht mehr planen“ dauerhaft ausblenden.</div>');
  S.tmp.ausgeblendet = l;
}
async function wiederPlanen(i){
  const a = S.tmp.ausgeblendet[i];
  await mit('Plane neu …', ()=>api('wiederPlanen', a.key));
  toast('Wird wieder geplant'); await neuLaden(true); render();
}
function renderFlaechen(){
  const grp = b => S.d.flaechen.filter(f=>f.bereich===b);
  const zeile = f => '<div class="zeile" onclick="flaecheDetail(\''+f.id+'\')"><div class="thumb">'+(f.typ==='Rasen'?'🟩':f.bereich==='Drinnen'?'🏠':'🌳')+'</div><div class="mitte"><div class="titel">'+esc(f.name)+'</div><div class="sub">'+esc(f.typ)+(f.licht?' · '+esc(f.licht):'')+' · '+S.d.pflanzen.filter(p=>p.flaecheId===f.id).length+' Pflanzen</div></div><span>›</span></div>';
  let html = zurueck;
  if(!S.d.flaechen.length) html += '<div class="karte" style="padding:14px"><p style="margin:0">Lege hier deine Bereiche an, z. B. <b>Vorgarten</b>, <b>Staudenbeet</b>, <b>Rasen</b> (Typ Rasen – dann kommt der Rasen-Jahresplan automatisch), <b>Terrasse</b>, <b>Wohnzimmer</b> und ein <b>Winterquartier</b> für Kübelpflanzen.</p><button class="knopf voll" style="margin-top:10px" onclick="flaecheForm()">+ Erste Fläche anlegen</button></div>';
  ['Draußen','Drinnen'].forEach(b => { const l = grp(b); if(l.length) html += '<h2>'+b+'</h2><div class="karte">'+l.map(zeile).join('')+'</div>'; });
  $('inhalt').innerHTML = html;
}
function renderKreise(){
  let html = zurueck + '<p class="sub">Lege deine automatischen Bewässerungskreise an und ordne die Pflanzen zu. Dann plant die App Inbetriebnahme, Sommer-Check und Winterentleerung ein und schickt bei Trockenheit keine Gießhinweise für diese Pflanzen.</p>';
  html += S.d.kreise.length ? '<div class="karte">'+S.d.kreise.map(k=>'<div class="zeile" onclick="kreisForm(\''+k.id+'\')"><div class="thumb">💧</div><div class="mitte"><div class="titel">'+esc(k.name)+'</div><div class="sub">'+S.d.pflanzen.filter(p=>p.kreisId===k.id).length+' Pflanzen'+(k.notiz?' · '+esc(k.notiz):'')+'</div></div><span>›</span></div>').join('')+'</div>'
    : '<button class="knopf voll" onclick="kreisForm()">+ Ersten Kreis anlegen</button>';
  $('inhalt').innerHTML = html;
}
async function renderRueckblick(jahr){
  jahr = jahr || S.tmp.rbJahr || heute().slice(0,4);
  S.tmp.rbJahr = jahr;
  $('inhalt').innerHTML = zurueck + '<div class="leer">Lade Rückblick …</div>';
  let r;
  try { r = await api('rueckblick', jahr); } catch(e){ return fehler(e); }
  if(S.tab!=='mehr' || S.mehr!=='rueckblick') return;
  S.tmp.rb = r;
  const max = Math.max(1, ...r.proMonat);
  let html = zurueck + '<select class="suche" onchange="S.tmp.rbJahr=this.value;renderRueckblick(this.value)">'+r.jahre.map(j=>'<option'+(j===jahr?' selected':'')+'>'+j+'</option>').join('')+'</select>';
  html += '<div class="kacheln" style="margin-top:12px"><div class="kachel"><b>'+r.erledigt+'</b><span>erledigt</span></div><div class="kachel"><b>'+r.fotosAnzahl+'</b><span>Fotos</span></div><div class="kachel"><b>'+r.neu.length+'</b><span>neue Pflanzen</span></div></div>';
  if(r.uebersprungen || r.verpasst) html += '<p class="sub" style="margin:8px 2px 0">'+r.uebersprungen+' übersprungen · '+r.verpasst+' verpasst</p>';
  html += '<h2>Erledigt pro Monat</h2><div class="karte"><div class="balken">'+r.proMonat.map((n,i)=>'<div><span>'+(n||'')+'</span><i style="height:'+(n/max*80)+'px"></i>'+MONATE[i].slice(0,1)+'</div>').join('')+'</div><div style="height:8px"></div></div>';
  const kats = Object.keys(r.proKat).sort((a,b)=>r.proKat[b]-r.proKat[a]);
  if(kats.length) html += '<h2>Nach Art</h2><div class="karte">'+kats.map(k=>'<div class="zeile" style="cursor:default"><div class="mitte">'+(KAT[k]||'')+' '+esc(k)+'</div><b>'+r.proKat[k]+'</b></div>').join('')+'</div>';
  if(r.vergleich.length) html += '<h2>Vorher – nachher</h2><div class="karte">'+r.vergleich.map(v=>'<div class="zeile" onclick="pflanzeDetail(\''+v.pflanzeId+'\')"><div class="vgl"><img src="'+esc((v.erstes.thumb||''))+'"><span>→</span><img src="'+esc((v.letztes.thumb||''))+'"></div><div class="mitte"><div class="titel ellipse">'+esc(v.name)+'</div><div class="sub">'+fd(v.erstes.datum.slice(0,10))+' → '+fd(v.letztes.datum.slice(0,10))+' · '+v.anzahl+' Fotos</div></div></div>').join('')+'</div>';
  if(r.checks.length) html += '<h2>Zustands-Checks</h2><div class="karte">'+r.checks.map(c=>'<div class="zeile" onclick="pflanzeDetail(\''+c.pflanzeId+'\')"><div class="mitte"><div class="titel">'+esc(c.name)+' <span class="badge'+({mittel:' gelb',schlecht:' rot'}[c.zustand]||'')+'">'+esc(c.zustand)+'</span></div><div class="sub">'+fd(c.datum.slice(0,10))+' · '+esc(c.text)+'</div></div></div>').join('')+'</div>';
  if(r.neu.length) html += '<h2>Neu im Garten</h2><div class="karte" style="padding:12px 14px">'+r.neu.map(esc).join(', ')+'</div>';
  if(r.liste.length) html += '<h2>Alle erledigten Arbeiten</h2><div class="karte">'+r.liste.map(a=>'<div class="zeile" style="cursor:default"><div class="mitte"><div class="titel">'+(KAT[a.kategorie]||'')+' '+esc(a.titel)+'</div><div class="sub">'+fd(a.erledigtAm)+(bezugText(a)?' · '+esc(bezugText(a)):'')+'</div></div></div>').join('')+'</div>';
  if(!r.erledigt && !r.fotosAnzahl) html += '<div class="leer">Für '+jahr+' gibt es noch nichts zurückzublicken.</div>';
  $('inhalt').innerHTML = html;
}
function mdZuDatum(md){ return md ? heute().slice(0,4)+'-'+md : ''; }
function renderEinstellungen(){
  const e = S.d.einstellungen;
  $('inhalt').innerHTML = zurueck +
    '<h2>KI (Claude)</h2><div class="karte" style="padding:4px 14px 14px">'+
      '<label class="feld">API-Schlüssel<input type="password" id="esKey" placeholder="'+(e.hatSchluessel?'hinterlegt ✓ – zum Ändern neu eingeben':'sk-ant-…')+'" autocomplete="off"></label>'+
      '<div class="reihe" style="margin-top:8px"><button class="knopf klein" onclick="schluesselSpeichern()">Schlüssel speichern</button>'+(e.hatSchluessel?'<button class="knopf klein zwei" onclick="kiTesten()">Verbindung testen</button>':'')+'</div>'+
      '<label class="feld">Modell<input id="esModell" value="'+esc(e.modell)+'"></label>'+
    '</div>'+
    '<h2>Ort (für Wetter)</h2><div class="karte" style="padding:4px 14px 14px">'+
      '<p class="sub" style="margin:10px 0 0">'+(e.ort?'Aktuell: <b>'+esc(e.ort)+'</b>':'Noch kein Ort gesetzt.')+'</p>'+
      '<div class="reihe" style="margin-top:6px"><input class="suche" id="esOrt" placeholder="Ort oder PLZ" style="flex:1"><button class="knopf" style="flex:none" onclick="ortSuchen()">Suchen</button></div><div id="ortTreffer"></div>'+
      '<div class="reihe"><label class="feld" style="flex:1">Frostwarnung ab °C<input type="number" step="0.5" id="esFrost" value="'+esc(e.frostSchwelle)+'"></label></div>'+
      '<div class="reihe"><label class="feld" style="flex:1">Gießhinweis Töpfe (Tage)<input type="number" id="esTrTopf" value="'+esc(e.trockenTopf)+'"></label><label class="feld" style="flex:1">Gießhinweis Beete (Tage)<input type="number" id="esTrBeet" value="'+esc(e.trockenBeet)+'"></label></div>'+
      '<p class="klein">Gießhinweise gibt es nur für nicht automatisch bewässerte Pflanzen draußen, wenn es so lange nicht nennenswert geregnet hat und es nicht zu kalt ist.</p>'+
    '</div>'+
    '<h2>Mähroboter</h2><div class="karte" style="padding:4px 14px 14px">'+
      '<label class="check"><input type="checkbox" id="esRobot" '+(e.maehroboter?'checked':'')+'> Mähroboter vorhanden</label>'+
      '<div class="reihe"><label class="feld" style="flex:1">Saisonstart ca.<input type="date" id="esRStart" value="'+mdZuDatum(e.robotStart)+'"></label><label class="feld" style="flex:1">Winterpause ab ca.<input type="date" id="esREnde" value="'+mdZuDatum(e.robotEnde)+'"></label></div>'+
      '<p class="klein">Das Jahr ist egal – es zählen Tag und Monat. Die Erinnerung kommt eine Woche vorher.</p>'+
    '</div>'+
    '<h2>Erinnerungen</h2><div class="karte" style="padding:4px 14px 14px">'+
      '<label class="check"><input type="checkbox" id="esMail" '+(e.mailAktiv?'checked':'')+'> Erinnerungs-Mails</label>'+
      '<label class="feld">An<input type="email" id="esMailAn" value="'+esc(e.mailAn)+'"></label>'+
      '<p class="klein">Montags eine Wochenübersicht, dazu sofort bei Frost (mit den betroffenen Pflanzen) und bei längerer Trockenheit. Push-Nachrichten (ntfy) lassen sich später ergänzen.</p>'+
    '</div>'+
    '<button class="knopf voll" style="margin-top:16px" onclick="einstellungenSpeichern()">Einstellungen speichern</button>';
}
async function schluesselSpeichern(){
  const k = feld('esKey'); if(!k) return toast('Bitte den Schlüssel einfügen.', true);
  await mit('Speichere …', ()=>api('speichereSchluessel', k));
  S.d.einstellungen.hatSchluessel = true; renderEinstellungen(); toast('Schlüssel gespeichert');
}
async function kiTesten(){
  try { await mit('Teste Verbindung …', ()=>api('testeKi')); toast('Verbindung klappt ✓'); } catch(e){}
}
async function ortSuchen(){
  const q = feld('esOrt'); if(!q) return;
  let t; try { t = await mit('Suche …', ()=>api('sucheOrt', q)); } catch(e){ return; }
  S.tmp.orte = t;
  $('ortTreffer').innerHTML = t.length ? '<div class="karte" style="margin-top:8px">'+t.map((o,i)=>'<div class="zeile" onclick="ortWaehlen('+i+')"><div class="mitte"><div class="titel">'+esc(o.name)+'</div><div class="sub">'+esc(o.region)+'</div></div></div>').join('')+'</div>' : '<p class="sub">Nichts gefunden.</p>';
}
async function ortWaehlen(i){
  const o = S.tmp.orte[i];
  await mit('Speichere …', ()=>api('speichereEinstellungen', {ort:o.name+(o.region?', '+o.region:''), lat:String(o.lat), lon:String(o.lon)}));
  await neuLaden(true); toast('Ort gesetzt: '+o.name);
}
async function einstellungenSpeichern(){
  const d = { modell:feld('esModell'), frostSchwelle:feld('esFrost'), trockenTopf:feld('esTrTopf'), trockenBeet:feld('esTrBeet'),
    maehroboter:$('esRobot').checked, robotStart:feld('esRStart').slice(5), robotEnde:feld('esREnde').slice(5),
    mailAktiv:$('esMail').checked, mailAn:feld('esMailAn') };
  await mit('Speichere …', ()=>api('speichereEinstellungen', d));
  await neuLaden(true); toast('Gespeichert');
}

/* ================= Start ================= */
// Meldet der eigenen Startseite (GitHub), dass die App geladen ist
try { window.top.postMessage('gartenjahr:bereit', '*'); } catch(e) {}
neuLaden();
</script>
</body>
</html>
